[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-model-activation-anomalies"
version = "0.2.0"
description = "Exploratory cross-model search for unusual hidden-state activations in causal language models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.2",
    "transformers>=4.50",
    "datasets>=3.0",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "numpy>=1.26",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
